services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  crud-api:
    build:
      context: ./services/crud-api
      dockerfile: Dockerfile
      target: development
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@host.docker.internal:54322/postgres"
      QDRANT_URL: "http://qdrant:6333"
      NODE_ENV: development
      LOG_LEVEL: debug
      TZ: Australia/Sydney
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./services/crud-api/src:/app/src:delegated
      - crud_api_node_modules:/app/node_modules
    depends_on:
      qdrant:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "anon-key-placeholder"
      NODE_ENV: development
      TZ: Australia/Sydney
    volumes:
      - ./apps/web/app:/app/app:delegated
      - ./apps/web/public:/app/public:delegated
      - web_node_modules:/app/node_modules
    depends_on:
      crud-api:
        condition: service_healthy

volumes:
  qdrant_data:
  crud_api_node_modules:
  web_node_modules:
